title: 5 Things
description: >-
  A personal daily-learning and trivia app. Each morning, five new facts
  are generated and added to the central fact store; a Take-25 quiz draws
  from everything you've learned so far.
baseurl: "/five-things"
url: "https://msiebert.github.io"

exclude:
  - README.md
  - docs/
  - Gemfile
  - Gemfile.lock
  - firestore.rules

# _data/ is excluded from the build output by default (leading underscore).
# facts.jsonl needs to reach the browser as a static file so the Take-25
# quiz's client-side fetch/cache layer (assets/js/fact-store.js) can load it
# — see docs/fact-store-client.md.
include:
  - _data/facts.jsonl

